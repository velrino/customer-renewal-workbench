name: Backend CI
on:
  push:
    branches: [feature/backend/api, master]
    paths: ['backend/api/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/api/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/api/go.mod
          cache-dependency-path: backend/api/go.sum
      - name: Verify Go API
        working-directory: backend/api
        run: |
          go vet ./...
          go test -race ./...
          go build -o "$RUNNER_TEMP/renewal-api" ./cmd/api
      - name: Verify build inputs
        working-directory: backend/api
        run: |
          context=$(mktemp -d)
          git -C ../.. archive HEAD:backend/api | tar -x -C "$context"
          git ls-files -- Dockerfile go.mod go.sum 'cmd/*.go' 'internal/*.go' \
            docs/docs.go docs/scalar.html docs/openapi.json | sort > "$RUNNER_TEMP/expected-inputs"

          cd "$context"
          touch cmd/api/local-settings.json internal/shared/notes.txt docs/local-config.json
          gcloud meta list-files-for-upload | sort > "$RUNNER_TEMP/cloud-inputs"
          diff -u "$RUNNER_TEMP/expected-inputs" "$RUNNER_TEMP/cloud-inputs"

          docker build -f - --output "type=local,dest=$RUNNER_TEMP/docker-inputs" . <<'DOCKERFILE'
          FROM scratch
          COPY . /
          DOCKERFILE
          (cd "$RUNNER_TEMP/docker-inputs" && find . -type f -printf '%P\n' | sort) > "$RUNNER_TEMP/docker-files"
          diff -u "$RUNNER_TEMP/expected-inputs" "$RUNNER_TEMP/docker-files"
      - name: Build API image
        working-directory: backend/api
        run: docker build .

  deploy:
    name: Deploy API to Cloud Run
    needs: api
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: renewal-api-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: customer-renewal-workbench
      REGION: us-central1
      IMAGE: us-central1-docker.pkg.dev/customer-renewal-workbench/cloud-run-source-deploy/renewal-api
      API_URL: https://renewal-api-809086370856.us-central1.run.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production image
        run: docker build -t "$IMAGE:$GITHUB_SHA" backend/api
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/809086370856/locations/global/workloadIdentityPools/renewal-github/providers/github
          service_account: renewal-deploy@customer-renewal-workbench.iam.gserviceaccount.com
      - name: Publish and deploy
        run: |
          git fetch --depth=1 origin master
          git diff --exit-code HEAD FETCH_HEAD -- backend/api .github/workflows/backend.yml
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE:$GITHUB_SHA"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          gcloud run services update renewal-api --project="$PROJECT" --region="$REGION" \
            --image="$digest" --update-env-vars="SENTRY_RELEASE=$GITHUB_SHA" --quiet
      - name: Verify the public contract and Firestore read
        run: |
          curl --fail --silent --show-error --retry 4 "$API_URL/openapi.json" -o "$RUNNER_TEMP/openapi.json"
          cmp backend/api/docs/openapi.json "$RUNNER_TEMP/openapi.json"
          curl --fail --silent --show-error --retry 4 "$API_URL/workbench/accounts?page=1&pageSize=1" \
            | jq -e '.page == 1 and (.items | length == 1)'
